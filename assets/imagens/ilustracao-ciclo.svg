<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="Poppins, Arial, sans-serif">
  <!-- Fundo -->
  <circle cx="260" cy="230" r="200" fill="#fde7cf"/>
  <circle cx="260" cy="230" r="128" fill="#fff8ec"/>
  <!-- Arcos do ciclo -->
  <path d="M260 70a160 160 0 0 1 160 160" fill="none" stroke="#f28c28" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 0"/>
  <path d="M420 230a160 160 0 0 1-160 160" fill="none" stroke="#7ab648" stroke-width="10" stroke-linecap="round"/>
  <path d="M260 390a160 160 0 0 1-160-160" fill="none" stroke="#f28c28" stroke-width="10" stroke-linecap="round"/>
  <path d="M100 230A160 160 0 0 1 260 70" fill="none" stroke="#7ab648" stroke-width="10" stroke-linecap="round"/>
  <!-- Setas -->
  <path d="M398 150l20 10 4-22" fill="none" stroke="#f28c28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M342 372l-14 18 22 6" fill="none" stroke="#7ab648" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M122 312l-20-10-4 22" fill="none" stroke="#f28c28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M178 88l14-18-22-6" fill="none" stroke="#7ab648" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Centro -->
  <path d="M260 268s-44-26-44-56c0-14 10-24 22-24 9 0 16 5 22 13 6-8 13-13 22-13 12 0 22 10 22 24 0 30-44 56-44 56z" fill="#1f4a2c"/>
  <text x="260" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#1f4a2c">Ciclo do Bem</text>
  <!-- Nós -->
  <g>
    <circle cx="260" cy="70" r="46" fill="#1f4a2c"/>
    <text x="260" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Doador</text>
    <text x="260" y="85" text-anchor="middle" font-size="12" fill="#f9c48c">chega</text>
  </g>
  <g>
    <circle cx="420" cy="230" r="46" fill="#f28c28"/>
    <text x="420" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4a2c">Doação</text>
    <text x="420" y="245" text-anchor="middle" font-size="12" fill="#1f4a2c">recorrente</text>
  </g>
  <g>
    <circle cx="260" cy="390" r="46" fill="#1f4a2c"/>
    <text x="260" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Tratamento</text>
    <text x="260" y="405" text-anchor="middle" font-size="12" fill="#f9c48c">gratuito</text>
  </g>
  <g>
    <circle cx="100" cy="230" r="46" fill="#7ab648"/>
    <text x="100" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4a2c">Sorriso</text>
    <text x="100" y="245" text-anchor="middle" font-size="12" fill="#1f4a2c">e emprego</text>
